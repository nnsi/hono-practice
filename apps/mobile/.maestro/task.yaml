appId: ${MAESTRO_APP_ID}
env:
  MAESTRO_APP_ID: com.actiko.app
  LOGIN_ID: e2e@example.com
  PASSWORD: password123
---
# Generate a per-run unique RUN_TAG so re-running this flow doesn't collide
# with tasks left from previous runs (e.g. `notVisible: del-XXX` would
# otherwise hit a leftover from an earlier run and fail).
- runScript: scripts/gen-run-tag.js
- runFlow: flows/login.yaml

# Use testID instead of pixel coords so this works on both iOS and Android.
- tapOn:
    id: tabs.tasks
- assertVisible:
    id: tasks.page

# Bring tasks.add into view regardless of how long the active list grows
# across re-runs (each run adds a couple of leftover rows above the FAB).
- scrollUntilVisible:
    element:
      id: tasks.add
    direction: DOWN
- swipe:
    start: "50%,30%"
    end: "50%,15%"

- tapOn:
    id: tasks.add
- extendedWaitUntil:
    visible:
      id: tasks.create.dialog
    timeout: 10000
- tapOn:
    id: tasks.create.titleInput
- inputText: done-${output.RUN_TAG}
- tapOn:
    id: tasks.create.dialog
- tapOn:
    id: tasks.create.submit
- extendedWaitUntil:
    visible: done-${output.RUN_TAG}
    timeout: 10000

# Prefixes plus the 14-character RUN_TAG must fit TASK_TITLE_MAX (20).
# Toggle done
- tapOn:
    text: done-${output.RUN_TAG}
# 完了済みセクションを展開（5/4 以降、完了タスクは折りたたまれた完了済みセクションに移動する）
# The completed-section preference persists between runs.
- scrollUntilVisible:
    element:
      text: "完了済み.*"
    direction: DOWN
    centerElement: true
- runFlow:
    when:
      visible: "完了済みを表示.*"
    commands:
      - tapOn: "完了済みを表示.*"
- extendedWaitUntil:
    visible:
      id: "tasks\\.archive\\..*"
    timeout: 10000

# Edit
- scrollUntilVisible:
    element:
      id: tasks.add
    direction: DOWN
- swipe:
    start: "50%,30%"
    end: "50%,15%"
- tapOn:
    id: tasks.add
- extendedWaitUntil:
    visible:
      id: tasks.create.dialog
    timeout: 10000
- tapOn:
    id: tasks.create.titleInput
- inputText: edit-${output.RUN_TAG}
- tapOn:
    id: tasks.create.dialog
- tapOn:
    id: tasks.create.submit
- extendedWaitUntil:
    visible: edit-${output.RUN_TAG}
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "edit-${output.RUN_TAG}, .*"
    direction: UP
    centerElement: true
- tapOn:
    text: "edit-${output.RUN_TAG}, .*"
- extendedWaitUntil:
    visible:
      id: tasks.edit.dialog
    timeout: 10000
- tapOn:
    id: tasks.edit.titleInput
- eraseText: 64
- inputText: after-${output.RUN_TAG}
- tapOn:
    id: tasks.edit.dialog
- tapOn:
    id: tasks.edit.update
- extendedWaitUntil:
    visible: after-${output.RUN_TAG}
    timeout: 10000

# Delete
- scrollUntilVisible:
    element:
      id: tasks.add
    direction: DOWN
- swipe:
    start: "50%,30%"
    end: "50%,15%"
- tapOn:
    id: tasks.add
- extendedWaitUntil:
    visible:
      id: tasks.create.dialog
    timeout: 10000
- tapOn:
    id: tasks.create.titleInput
- inputText: del-${output.RUN_TAG}
- tapOn:
    id: tasks.create.dialog
- tapOn:
    id: tasks.create.submit
- extendedWaitUntil:
    visible: del-${output.RUN_TAG}
    timeout: 10000
- scrollUntilVisible:
    element:
      text: "del-${output.RUN_TAG}, .*"
    direction: UP
    centerElement: true
- tapOn:
    text: "del-${output.RUN_TAG}, .*"
- extendedWaitUntil:
    visible:
      id: tasks.edit.dialog
    timeout: 10000
- tapOn:
    id: tasks.edit.delete
- extendedWaitUntil:
    visible:
      id: tasks.deleteConfirm.dialog
    timeout: 10000
- tapOn:
    id: tasks.deleteConfirm.confirm
- extendedWaitUntil:
    notVisible: del-${output.RUN_TAG}
    timeout: 10000
