appId: ${MAESTRO_APP_ID}
---
# アクティビティ新規作成: グリッド下の「追加」ボタンをタップしてダイアログから作成
# 同じ画面のタスク節にも「追加」があるので testID で指定する
# Maestro Android driver は Unicode inputText 非対応のため ASCII 名で作成
- scrollUntilVisible:
    element:
      id: actiko.addActivity
    direction: DOWN
- tapOn:
    id: actiko.addActivity
- assertVisible:
    id: actiko.create.dialog
- tapOn:
    id: actiko.create.nameInput
- inputText: E2E-NEW
- tapOn:
    id: actiko.create.unitInput
- inputText: pcs
- tapOn:
    id: actiko.create.dialog
- tapOn:
    id: actiko.create.submit
- extendedWaitUntil:
    notVisible:
      id: actiko.create.dialog
    timeout: 10000
- assertVisible: E2E-NEW
