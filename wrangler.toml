name = "actiko-backend"
main = "apps/backend/server.cf.ts"
compatibility_date = "2025-01-12"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive の origin (Neon ap-southeast-1) 近くで Worker を実行し、
# 直列 DB クエリ 1 回あたりの往復 (~150ms) を縮める
[placement]
mode = "smart"

# DOマイグレーション: v1で作成したKeyValueDOをv2で削除
[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeyValueDO"]

[[migrations]]
tag = "v2"
deleted_classes = ["KeyValueDO"]

# stg環境
[env.stg.vars]
NODE_ENV = "stg"
STORAGE_TYPE = "r2"

[[env.stg.analytics_engine_datasets]]
binding = "WAE_LOGS"
dataset = "actiko_api_logs"

[[env.stg.analytics_engine_datasets]]
binding = "WAE_CLIENT_ERRORS"
dataset = "actiko_client_errors"

# production環境
[env.production.vars]
NODE_ENV = "production"
STORAGE_TYPE = "r2"

[[env.production.analytics_engine_datasets]]
binding = "WAE_LOGS"
dataset = "actiko_api_logs"

[[env.production.analytics_engine_datasets]]
binding = "WAE_CLIENT_ERRORS"
dataset = "actiko_client_errors"
